# Render Blueprint — deploy from nitkbrc/PerfTrack (brcSir).
# Dashboard: New → Blueprint → select this repo → set RAILS_MASTER_KEY → Approve.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: scats
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: scats-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: scats-db
    plan: free
